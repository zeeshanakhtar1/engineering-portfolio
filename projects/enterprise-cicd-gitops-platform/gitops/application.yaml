apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: engineering-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/zeeshanakhtar1/engineering-portfolio.git
    targetRevision: main
    path: projects/kubernetes-cluster-operations/k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: engineering-lab
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
# No automated synchronization or pruning until reviewed by a cluster operator.
