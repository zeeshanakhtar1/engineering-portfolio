services:
  anomaly-api:
    build: .
    ports:
      - '127.0.0.1:8091:8091'
    environment:
      AIOPS_HOST: 0.0.0.0
      AIOPS_DB: /data/metrics.sqlite3
    volumes:
      - metric-data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 0.5
volumes:
  metric-data:
