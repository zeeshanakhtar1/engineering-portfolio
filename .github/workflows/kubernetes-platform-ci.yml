name: Kubernetes Platform CI
on:
  push:
    paths:
      - 'projects/kubernetes-cluster-operations/**'
      - '.github/workflows/kubernetes-platform-ci.yml'
  pull_request:
    paths:
      - 'projects/kubernetes-cluster-operations/**'
      - '.github/workflows/kubernetes-platform-ci.yml'
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/kubernetes-cluster-operations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: API unit tests
        run: python -m unittest discover -s tests -v
      - name: Local container build
        run: docker build -t platform-example-api:ci .
