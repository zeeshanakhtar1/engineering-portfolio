name: Magnum API inspection
on:
  push:
    branches: [data-export/magnum-1985-2026]
    paths: ['magnum/probe.py','.github/workflows/magnum-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python magnum/probe.py