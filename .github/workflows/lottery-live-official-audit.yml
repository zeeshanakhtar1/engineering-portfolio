name: Lottery Official Historical Audit
on:
  push:
    branches: [data-export/lottery-live-audit-20261026]
    paths: ['lottery_audit/fetch_official.py','.github/workflows/lottery-live-official-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Fetch every operator historical result
        run: python -u lottery_audit/fetch_official.py
      - name: Upload operator records for verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: both-lotteries-official-records-20261026
          path: official_data/
          if-no-files-found: warn
          retention-days: 7
